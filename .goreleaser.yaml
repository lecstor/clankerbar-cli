# GoReleaser config — cross-compiles tagged releases and publishes a GitHub
# Release with archives + checksums. Trigger: push a semver tag `vX.Y.Z`.
# Validate locally with `goreleaser check` and `goreleaser release --snapshot --clean`.
version: 2

project_name: clankerbar

before:
  hooks:
    # NOT `go mod tidy`. Tidy REWRITES go.mod/go.sum from the network in the middle
    # of a release, so the dependency set that gets compiled into the published
    # binary need not be the one reviewed on the tagged commit. `download` fetches
    # exactly the versions go.mod already pins, `verify` checks the module cache
    # against go.sum, and the `git diff` below turns "the release did not mutate
    # its own inputs" from an assertion into a check that fails the release.
    - go mod download
    - go mod verify
    - git diff --exit-code -- go.mod go.sum

builds:
  - id: clankerbar
    main: ./cmd/clankerbar
    binary: clankerbar
    env:
      - CGO_ENABLED=0
    # GoReleaser sets no default build flags, so this list adds rather than
    # replaces. -mod=readonly is already the go default, making it a latch rather
    # than a fix: it keeps the guarantee if a GOFLAGS or a future hook relaxes it,
    # and an import missing from go.mod fails the release instead of being added
    # to it. -trimpath keeps the runner's filesystem paths out of the published
    # binary and makes the build reproducible - which is what makes the provenance
    # attestation worth having, since a third party can rebuild and compare.
    flags:
      - -mod=readonly
      - -trimpath
    # version.Current is stamped so `clankerbar version` reports the release tag
    # and the fleet presence beacon reports it (CLA-466).
    ldflags:
      - -s -w -X github.com/lecstor/clankerbar-cli/internal/version.Current={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: clankerbar
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  # `use: github` needs a PREVIOUS tag to diff against. On the first tag there is
  # none, and GoReleaser SILENTLY falls back to the plain `git` changeloger, which
  # logs the entire history. That is survivable for v0.1.0 (the whole history is
  # what v0.1.0 is) but only because the grouping and filters below make it
  # readable - without them it was 51 lines of raw SHAs and merge commits carrying
  # internal branch slugs, sorted alphabetically. Do not remove them.
  use: github
  # No `sort:` on purpose. `sort: asc` orders ALPHABETICALLY by commit subject, not
  # chronologically, which interleaves "#1, #10, #11, #2" and reads as damage.
  # Empty keeps git order.
  filters:
    exclude:
      # Scoped conventional-commit types are the norm here (`test(loop):`), and an
      # unscoped `^test:` does not match them - hence the optional scope group.
      - "^docs(\\(.+\\))?:"
      - "^test(\\(.+\\))?:"
      - "^chore(\\(.+\\))?:"
      # Review-cycle chatter and merge commits carrying internal branch slugs.
      # Both are ours, not news to anyone installing this.
      - "^review(\\(.+\\))?:"
      - "^Merge pull request"
      - "^Merge branch"
      - "^Merge remote-tracking branch"
  groups:
    # The README promises a breaking change is never silent. This is what makes
    # that true rather than aspirational: `!`-marked commits are hoisted to the
    # top under their own heading instead of sitting mid-list.
    - title: "Breaking changes"
      regexp: '^.*?[a-zA-Z]+(\(.+\))?!:.+$'
      order: 0
    - title: "Features"
      regexp: '^.*?feat(\(.+\))?:.+$'
      order: 1
    - title: "Fixes"
      regexp: '^.*?fix(\(.+\))?:.+$'
      order: 2
    - title: "Other changes"
      order: 999

release:
  github:
    owner: lecstor
    name: clankerbar-cli
  draft: false
  # `auto` marks a release as a prerelease only when the tag carries a semver
  # prerelease field (`v0.1.0-rc1`). Plain `v0.1.0` publishes as a full release.
  prerelease: auto
