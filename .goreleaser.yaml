# GoReleaser config — cross-compiles tagged releases and publishes a GitHub
# Release with archives + checksums. Trigger: push a semver tag `vX.Y.Z`.
# Validate locally with `goreleaser check` and `goreleaser release --snapshot --clean`.
version: 2

project_name: clankerbar

before:
  hooks:
    - go mod tidy

builds:
  - id: clankerbar
    main: ./cmd/clankerbar
    binary: clankerbar
    env:
      - CGO_ENABLED=0
    # main.version is stamped so `clankerbar version` reports the release tag.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: clankerbar
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Auto-generate release notes from the commit history / PRs.
  github:
    owner: lecstor
    name: clankerbar-cli
  draft: false
  prerelease: auto
