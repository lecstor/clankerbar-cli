name: promote

# Keep the standing `staging -> main` promotion PR present and current.
#
# Every push to `staging` (a task PR merged in by a clanker servicing the
# close-out queue) ensures the permanent `staging -> main` release PR EXISTS and
# that its queued-work body is up to date. That PR is the human-gated publish
# surface: merging it is what publishes a release, and only the operator may
# merge it. No agent has to remember to run anything — CI owns it.
#
# Idempotent: it updates the open PR, CREATES one if a prior promotion closed it
# (which happens on every publish, since merging closes the PR), and no-ops when
# `staging` is level with `main` — the state realign-staging.yml leaves behind
# immediately after a promotion.

on:
  push:
    branches: [staging]
  # Hand-runnable, for recovering the PR without waiting for the next merge.
  workflow_dispatch:

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promotion-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The script walks `origin/main..origin/staging` and derives a version
    # preview; checkout uses the default GITHUB_TOKEN, so contents:read is all it
    # needs. `gh` authenticates from a scoped PAT instead — see the step below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Full history and tags: the script walks the first-parent commits of
        # `origin/main..origin/staging` for the queued-work table, and reads the
        # last tag for the version preview. A shallow clone can see neither.
        with:
          fetch-depth: 0

      # For the version preview inside the script. Best-effort there: if this or
      # the derivation fails, the PR body still updates, just without the preview.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Ensure standing staging → main promotion PR
        # gh authenticates from GH_TOKEN, and this is a SCOPED PAT
        # (PROMOTION_PR_TOKEN), not the default GITHUB_TOKEN. The repo setting
        # "Allow GitHub Actions to create and approve pull requests" is OFF here
        # (verified 2026-08-10): the default token can EDIT an already-open PR but
        # is refused when it must CREATE one — and creation is not an edge case,
        # it happens on every cycle, because merging the promotion closes the PR.
        # The PAT needs only Contents:read + Pull requests:write on this repo.
        #
        # Trade-off vs GITHUB_TOKEN: a PR created by a PAT CAN trigger further
        # workflows (a GITHUB_TOKEN-created one cannot). Here that is safe and in
        # fact wanted — `ci.yml` runs on pull_request, so a real `ci` check lands
        # on the release PR. `release-on-merge.yml` triggers only on a push to
        # `main`, so creating or updating this PR publishes NOTHING. Only MERGING
        # it does, which is exactly the gate.
        #
        # If the secret is unset, gh errors and this job goes RED. That is the
        # intended signal to provision the PAT, not a failure to work around: a
        # silently-missing promotion PR is how a release quietly stops happening.
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_PR_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PROMOTION_PR_TOKEN is not set. The standing staging → main promotion PR cannot be created without it (the default GITHUB_TOKEN is refused when creating PRs). Provision it — see docs/releases.md."
            exit 1
          fi
          bash scripts/update-promotion-pr.sh
