name: ci

# Gate every PR (and every push to an integration branch) on a clean build, vet,
# and race-enabled test run. This is the "green check" merges are gated on — it
# is a required status check on both `main` and `staging` via branch protection.
#
# The push list is not cosmetic, and each branch in it is load-bearing for a
# DIFFERENT reason. Both failures are silent until someone tries to ship.
#
# `main`: TWO workflows wait for the `ci` check of the MERGE COMMIT ON MAIN, not
# the PR's check - `release-on-merge.yml` before it publishes, and
# `realign-staging.yml` before it fast-forwards `staging`. They read the merge
# commit because main's protection is `strict: false`, so a PR can merge without
# being up to date and the commit that actually lands may be a combination
# nothing ever compiled. Both have something to read only because `main` is in
# this list; drop it and each waits, finds nothing, and (correctly) refuses.
#
# `staging`: it is what keeps the standing promotion PR MERGEABLE. `promote.yml`
# opens that PR with GITHUB_TOKEN, which triggers a `pull_request` run that
# parks at `action_required`, contributing NO check run until a human approves
# it, at which point it runs and becomes a second `ci` check under the same
# required `ci` context. That approval is not needed for the merge: `main`
# requires the `ci` check against the PR's head SHA, and this very trigger -
# the push run on that SHA - already satisfies it. Drop `staging` from the
# push list and nothing does: the only run left is the parked one, so every
# promotion sits UNSTABLE until someone approves by hand instead of being
# mergeable outright.
on:
  pull_request:
  push:
    branches: [main, staging]

# A newer push to the same PR supersedes an in-flight run - but NEVER on `main`
# or `staging`.
#
# On a PR, cancelling is free: the only consumer is the PR's own check, and it is
# about to be replaced. On an integration branch it is not free, because `ci` is
# now the input to two other workflows. A cancelled run concludes `cancelled`,
# which the release gate correctly scores as a FAILURE - so two pushes to `main`
# in quick succession (a promotion plus a break-glass fix) would cancel the first
# commit's `ci` and, with it, that commit's release and the `staging` realign.
# The realign has a workflow_dispatch escape hatch for when this happens anyway;
# not cancelling is what stops it happening.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    # This name is LOAD-BEARING. GitHub names a check run after its job, and
    # `release-on-merge.yml` gates publishing on a check called exactly `ci`
    # (internal/release.DefaultRequiredCheck). Rename it, or add a matrix, and the
    # gate waits for a check that never arrives and refuses every release.
    # TestRequiredCheckMatchesTheCIWorkflow fails if this drifts.
    name: ci
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs, like release.yml - the trailing comment is the
      # version label, the SHA is what is fetched. This job only holds
      # `contents: read`, so the blast radius is smaller than release.yml's, but a
      # substituted action here still runs arbitrary code against every PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pin Go to the version declared in go.mod (currently 1.26) so CI and the
      # module never drift. go-version-file reads the `go` DIRECTIVE - a range
      # like `1.26`, never the toolchain pin. check-latest matters because
      # govulncheck below is a BLOCKING gate on a repo whose only realistic
      # vulnerability class is the stdlib. Left at the default, setup-go
      # searches the runner's tool cache first, so `go 1.26` resolves to the
      # newest 1.26.x baked into the image - not the newest that exists.
      # Between a Go security release and the image rebuilding, that leaves CI
      # red on every PR with no repo-side fix available.
      #
      # check-latest alone does NOT self-heal, even after the patch exists:
      # it resolves the `go 1.26` range against the actions/go-versions
      # manifest, which LAGS a fresh Go security release, so it installs the
      # previous patch (observed 2026-08-14: govulncheck red on 1.26.5 with
      # go1.26.6 already out - CLA-356). The go command only switches
      # toolchains UP, never down to a pinned older one, so the one-line
      # toolchain bump in go.mod is what forces the patched version once it
      # exists; this comment used to claim check-latest did that on its own.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # With one direct dependency, a stdlib CVE is the likeliest way this ships a
      # known-vulnerable binary, and govulncheck is the only check here that looks
      # at the toolchain rather than the code. It reports only vulnerabilities the
      # code actually REACHES, so it stays quiet about the rest of the stdlib.
      #
      # Installed by module version rather than via govulncheck-action: a
      # `pkg@version` install is immutable and checked against the Go checksum
      # database, which is a stronger pin than a git SHA and one less action in the
      # supply chain.
      #
      # This can go red on a disclosure before a patched Go exists. That is the
      # check working - the fix is to wait for the patch, not to drop the step.
      # With go.mod's toolchain PIN, the fix once the patch exists is a one-line
      # bump of that pin (CLA-356): check-latest resolves the `go 1.26` range
      # against a manifest that lags the release, so it installs the previous
      # patch; the go command then switches UP to the bumped pin, so the pin -
      # not check-latest - is what picks the patch up.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

# golangci-lint was evaluated and deliberately left out for now: golangci-lint v2
# flags a handful of low-value nits (unchecked fmt.Fprint* returns, a nil test
# context) that would only add a perpetually-red, non-blocking check. Add it back
# once the findings are addressed or a tuned .golangci.yml silences them, so the
# lint signal is trustworthy rather than noise.
