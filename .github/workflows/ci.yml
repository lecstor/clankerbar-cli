name: ci

# Gate every PR (and every push to main) on a clean build, vet, and race-enabled
# test run. This is the "green check" the operator gates merges on — make it a
# required status check on main via branch protection.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs, like release.yml - the trailing comment is the
      # version label, the SHA is what is fetched. This job only holds
      # `contents: read`, so the blast radius is smaller than release.yml's, but a
      # substituted action here still runs arbitrary code against every PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pin Go to the version declared in go.mod (currently 1.26) so CI and the
      # module never drift. go-version-file reads the toolchain line directly.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # With one direct dependency, a stdlib CVE is the likeliest way this ships a
      # known-vulnerable binary, and govulncheck is the only check here that looks
      # at the toolchain rather than the code. It reports only vulnerabilities the
      # code actually REACHES, so it stays quiet about the rest of the stdlib.
      #
      # Installed by module version rather than via govulncheck-action: a
      # `pkg@version` install is immutable and checked against the Go checksum
      # database, which is a stronger pin than a git SHA and one less action in the
      # supply chain.
      #
      # This can go red on a disclosure before a patched Go exists. That is the
      # check working - the fix is to bump Go once the patch lands, not to drop the
      # step. go-version-file resolves `go 1.26` to the newest 1.26.x, so a patched
      # toolchain is picked up without a repo change.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

# golangci-lint was evaluated and deliberately left out for now: golangci-lint v2
# flags a handful of low-value nits (unchecked fmt.Fprint* returns, a nil test
# context) that would only add a perpetually-red, non-blocking check. Add it back
# once the findings are addressed or a tuned .golangci.yml silences them, so the
# lint signal is trustworthy rather than noise.
